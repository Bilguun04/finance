{% extends "base.html" %}
{% block title %}{% if is_edit %}Edit holding{% else %}Add holding{% endif %}{% endblock %}
{% block content %}
<h1>{% if is_edit %}Edit holding{% else %}Add holding{% endif %}</h1>
<form method="post" class="stacked">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>
<a href="{% url 'portfolio:detail' %}">Cancel</a>
{% endblock %}
