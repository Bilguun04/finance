{% extends "base.html" %}
{% block title %}Delete holding{% endblock %}
{% block content %}
<h1 class="mb-4 text-3xl font-bold leading-tight tracking-tight">Delete {{ holding.symbol }}?</h1>
<form method="post" class="mb-4 max-w-md space-y-4 rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    {% csrf_token %}
    <button type="submit" class="inline-block rounded-md border border-red-600 bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:border-red-700 hover:bg-red-700">Delete</button>
    <a href="{% url 'portfolio:detail' %}" class="ml-2 inline-block rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-900 hover:bg-slate-100">Cancel</a>
</form>
{% endblock %}
