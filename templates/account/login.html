{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1 class="mb-4 text-3xl font-bold leading-tight tracking-tight">Log in</h1>
<form method="post" class="mb-4 max-w-md space-y-4 rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="inline-block rounded-md border border-indigo-600 bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:border-indigo-700 hover:bg-indigo-700" type="submit">Log in</button>
</form>
<p class="text-slate-500">Need an account? <a class="text-indigo-600" href="{% url 'account:signup' %}">Sign up</a></p>
{% endblock %}
