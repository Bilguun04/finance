{% extends "base.html" %}
{% block title %}Profile | Finance Tracker{% endblock %}
{% block content %}
<h1 class="mb-6 text-3xl font-bold leading-tight tracking-tight">{{ user.get_username }}</h1>

<dl class="mb-6 grid max-w-md grid-cols-[auto_1fr] gap-x-6 gap-y-3 rounded-lg border border-slate-200 bg-white p-5 text-sm shadow-sm">
    <dt class="font-semibold text-slate-500">Username</dt>
    <dd class="m-0">{{ user.get_username }}</dd>
    <dt class="font-semibold text-slate-500">Email</dt>
    <dd class="m-0">{{ user.email }}</dd>
    <dt class="font-semibold text-slate-500">Member since</dt>
    <dd class="m-0">{{ user.date_joined|date:"F j, Y" }}</dd>
</dl>

<a class="inline-block rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-900 no-underline hover:bg-slate-100" href="{% url 'account:password_change' %}">Change password</a>
{% endblock %}
