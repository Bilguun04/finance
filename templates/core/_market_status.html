{% with state=market_status.state %}
<span id="market-status" {% if oob %}hx-swap-oob="true"{% endif %}
      class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 font-bold
             {% if state == 'open' %}bg-emerald-50 text-emerald-700
             {% elif state == 'pre_market' or state == 'after_hours' %}bg-amber-50 text-amber-700
             {% elif state == 'overnight' %}bg-indigo-50 text-indigo-700
             {% else %}bg-slate-100 text-slate-600{% endif %}"
      title="US market hours (ET): pre-market 4:00–9:30, regular 9:30–4:00, after-hours 4:00–8:00">
    <span class="relative flex h-2 w-2">
        {% if state == 'open' %}
            <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
        {% endif %}
        <span class="relative inline-flex h-2 w-2 rounded-full
                     {% if state == 'open' %}bg-emerald-500
                     {% elif state == 'pre_market' or state == 'after_hours' %}bg-amber-500
                     {% elif state == 'overnight' %}bg-indigo-500
                     {% else %}bg-slate-400{% endif %}"></span>
    </span>
    {{ market_status.label }}{% if market_status.holiday and state == 'closed' %} · {{ market_status.holiday }}{% endif %}
</span>
{% endwith %}
