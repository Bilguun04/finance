<tr id="holding-row-{{ holding.id }}"
    hx-post="{% url 'portfolio:holding_edit' holding.id %}"
    hx-target="#holdings-wrapper"
    hx-swap="outerHTML"
    hx-trigger="click from:.save-btn">
    <td>{{ form.symbol }}</td>
    <td>{{ form.name }}</td>
    <td>{{ form.asset_type }}</td>
    <td>{{ form.quantity }}</td>
    <td>{{ form.cost_basis_per_unit }}</td>
    <td>{{ form.current_price }}</td>
    <td colspan="2">
        <button type="button" class="save-btn inline-block rounded-md border border-indigo-600 bg-indigo-600 px-3 py-1.5 text-sm font-semibold text-white hover:border-indigo-700 hover:bg-indigo-700">Save</button>
        <a class="inline-block rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-semibold text-slate-900 hover:bg-slate-100"
           href="{% url 'portfolio:detail' %}"
           hx-get="{% url 'portfolio:detail' %}"
           hx-select="#holdings-wrapper"
           hx-target="#holdings-wrapper"
           hx-swap="outerHTML">
            Cancel
        </a>
    </td>
</tr>
{% if form.errors %}
<tr>
    <td colspan="9"><ul class="list-none p-0 text-sm text-red-600">{{ form.errors }}</ul></td>
</tr>
{% endif %}
