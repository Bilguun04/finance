<tr id="holding-row-{{ holding.id }}">
    <td>{{ holding.symbol }}</td>
    <td>{{ holding.name }}</td>
    <td>{{ holding.get_asset_type_display }}</td>
    <td>{{ holding.quantity }}</td>
    <td>{{ holding.cost_basis_per_unit }}</td>
    <td>{{ holding.current_price }}</td>
    <td>{{ holding.market_value|floatformat:2 }}</td>
    <td class="font-semibold {% if holding.gain_loss >= 0 %}bg-emerald-50 text-emerald-600{% else %}bg-red-50 text-red-600{% endif %}">
        {{ holding.gain_loss|floatformat:2 }} ({{ holding.gain_loss_pct|floatformat:1 }}%)
    </td>
    <td>
        <button
            type="button"
            class="mr-1 inline-block rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-semibold text-slate-900 hover:bg-slate-100"
            hx-get="{% url 'portfolio:holding_edit' holding.id %}"
            hx-target="#holding-row-{{ holding.id }}"
            hx-swap="outerHTML">
            Edit
        </button>
        <button
            type="button"
            class="inline-block rounded-md border border-red-600 bg-red-600 px-3 py-1.5 text-sm font-semibold text-white hover:border-red-700 hover:bg-red-700"
            hx-delete="{% url 'portfolio:holding_delete' holding.id %}"
            hx-target="#holdings-wrapper"
            hx-swap="outerHTML"
            hx-confirm="Delete {{ holding.symbol }}?">
            Delete
        </button>
    </td>
</tr>
