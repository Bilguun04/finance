{% extends "base.html" %}
{% block title %}{% if is_edit %}Edit holding{% else %}Add holding{% endif %}{% endblock %}
{% block content %}
<h1 class="mb-4 text-3xl font-bold leading-tight tracking-tight">{% if is_edit %}Edit holding{% else %}Add holding{% endif %}</h1>
<form method="post" class="mb-4 max-w-md space-y-4 rounded-lg border border-slate-200 bg-white p-6 shadow-sm [&_p]:m-0 [&_p]:flex [&_p]:flex-col [&_p]:gap-1 [&_label]:mb-1 [&_label]:block [&_label]:text-sm [&_label]:font-semibold [&_label]:text-slate-600 [&_input]:rounded-md [&_input]:border [&_input]:border-slate-300 [&_input]:px-3 [&_input]:py-2 [&_input]:text-slate-900 [&_select]:rounded-md [&_select]:border [&_select]:border-slate-300 [&_select]:px-3 [&_select]:py-2">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="inline-block rounded-md border border-indigo-600 bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:border-indigo-700 hover:bg-indigo-700" type="submit">Save</button>
</form>
<a class="text-indigo-600" href="{% url 'portfolio:detail' %}">Cancel</a>
{% endblock %}
