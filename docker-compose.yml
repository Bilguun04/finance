services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      # From the container's perspective, the emulator suite runs on the
      # Docker host, not inside this container.
      FIRESTORE_EMULATOR_HOST: host.docker.internal:8080
      FIREBASE_AUTH_EMULATOR_HOST: host.docker.internal:9099
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
