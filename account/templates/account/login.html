{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
<form id="login-form" class="stacked card">
    <p>
        <label for="email">Email</label>
        <input type="email" id="email" required>
    </p>
    <p>
        <label for="password">Password</label>
        <input type="password" id="password" required>
    </p>
    <button type="submit">Log in</button>
</form>
<button type="button" id="google-signin" class="btn secondary">Sign in with Google</button>
<p id="login-error" class="errorlist"></p>
<p>Need an account? <a href="{% url 'account:signup' %}">Sign up</a></p>

<script type="module">
    function onReady(callback) {
        if (window.firebaseAuth) {
            callback();
        } else {
            window.addEventListener("firebase-auth-ready", callback, { once: true });
        }
    }

    onReady(() => {
        const { auth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, postSession } = window.firebaseAuth;
        const errorBox = document.getElementById("login-error");

        async function completeLogin(userCredential) {
            const idToken = await userCredential.user.getIdToken();
            const resp = await postSession(idToken);
            if (resp.ok) {
                window.location.href = "{{ next|escapejs }}" || "{% url 'core:dashboard' %}";
            } else {
                errorBox.textContent = "Login failed. Please try again.";
            }
        }

        document.getElementById("login-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            errorBox.textContent = "";
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            try {
                const credential = await signInWithEmailAndPassword(auth, email, password);
                await completeLogin(credential);
            } catch (err) {
                errorBox.textContent = "Invalid email or password.";
            }
        });

        document.getElementById("google-signin").addEventListener("click", async () => {
            errorBox.textContent = "";
            try {
                const credential = await signInWithPopup(auth, new GoogleAuthProvider());
                await completeLogin(credential);
            } catch (err) {
                errorBox.textContent = "Google sign-in failed.";
            }
        });
    });
</script>
{% endblock %}
