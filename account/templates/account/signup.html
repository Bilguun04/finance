{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<h1 class="mb-4 text-3xl font-bold leading-tight tracking-tight">Create your account</h1>
<form id="signup-form" class="mb-4 max-w-md space-y-4 rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    <p class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-slate-600" for="email">Email</label>
        <input class="rounded-md border border-slate-300 bg-white px-3 py-2 text-slate-900 outline-none transition focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100" type="email" id="email" required>
    </p>
    <p class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-slate-600" for="password">Password</label>
        <input class="rounded-md border border-slate-300 bg-white px-3 py-2 text-slate-900 outline-none transition focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100" type="password" id="password" minlength="6" required>
    </p>
    <button class="inline-block rounded-md border border-indigo-600 bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:border-indigo-700 hover:bg-indigo-700" type="submit">Sign up</button>
</form>
<button type="button" id="google-signin" class="mb-4 inline-block rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-900 hover:bg-slate-100">Sign up with Google</button>
<p id="signup-error" class="mb-4 text-sm text-red-600"></p>
<p class="text-slate-500">Already have an account? <a class="text-indigo-600" href="{% url 'account:login' %}">Log in</a></p>

<script type="module">
    function onReady(callback) {
        if (window.firebaseAuth) {
            callback();
        } else {
            window.addEventListener("firebase-auth-ready", callback, { once: true });
        }
    }

    onReady(() => {
        const {
            auth,
            createUserWithEmailAndPassword,
            signInWithPopup,
            GoogleAuthProvider,
            postSession,
        } = window.firebaseAuth;
        const errorBox = document.getElementById("signup-error");

        async function completeSignup(userCredential) {
            const idToken = await userCredential.user.getIdToken();
            const resp = await postSession(idToken);
            if (resp.ok) {
                window.location.href = "{% url 'core:dashboard' %}";
            } else {
                errorBox.textContent = "Sign up failed. Please try again.";
            }
        }

        document.getElementById("signup-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            errorBox.textContent = "";
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            try {
                const credential = await createUserWithEmailAndPassword(auth, email, password);
                await completeSignup(credential);
            } catch (err) {
                errorBox.textContent = "Could not create account (email may already be in use).";
            }
        });

        document.getElementById("google-signin").addEventListener("click", async () => {
            errorBox.textContent = "";
            try {
                const credential = await signInWithPopup(auth, new GoogleAuthProvider());
                await completeSignup(credential);
            } catch (err) {
                errorBox.textContent = "Google sign-in failed.";
            }
        });
    });
</script>
{% endblock %}
