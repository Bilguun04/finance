name: Django CI

on:
  pull_request:
    branches: ["staging", "production"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (uv + ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check uv.lock is up to date with pyproject.toml
        run: uv lock --check

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Lint
        run: uv run --locked ruff check --output-format=github .

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_test
          POSTGRES_USER: django
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U django -d finance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: finance_test
      POSTGRES_USER: django
      POSTGRES_PASSWORD: ci_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node modules (if package.json exists)
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Build Tailwind CSS
        run: |
          # Replace this with your project's specific Tailwind build command
          npm run build:css

      - name: Check migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Collect static files
        run: uv run python manage.py collectstatic --noinput

      - name: Run tests
        run: uv run python manage.py test --verbosity=2